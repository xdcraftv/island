[package]
name = "island"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
sysinfo = "0.32"
arboard = "3"
serde_json = "1"
windows = { version = "0.58", features = [
  "Foundation",
  "Media_Control",
  "Storage_Streams",
  "Win32_System_Com",
  "Devices_Geolocation",
  "Devices_Enumeration",
  "Media_Devices",
  "System_Power",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant"
] }
